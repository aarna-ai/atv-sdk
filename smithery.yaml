# Smithery configuration for ATV MCP server
# https://smithery.ai/docs/build/publish

startCommand:
  type: http
  url: https://atv-api.aarna.ai/mcp

configSchema:
  type: object
  properties:
    ATV_API_KEY:
      type: string
      title: API Key
      description: API key for authenticating with the ATV API. Get one at https://aarna.ai
      x-from: header
  required:
    - ATV_API_KEY
